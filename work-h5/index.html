<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#1677ff" />
    <title>项目工作台账</title>
    <!-- 预加载钉钉 JSAPI SDK：与主 bundle 并行下载，免登链路提前 1-2 秒 -->
    <link rel="preload" as="script" href="https://g.alicdn.com/dingding/dingtalk-jsapi/3.0.25/dingtalk.open.js" />
    <style>
      /* 启动加载态：纯 CSS 实现（不依赖 JS bundle），Vue 挂载时自动替换 #app 内容。
         修复：首进应用 JS 未加载完成期间纯白屏、用户以为卡死的问题 */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f8fb;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #8a94a6;
        font-size: 14px;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #dde4ef;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-retry {
        display: none;
        margin-top: 4px;
        padding: 8px 22px;
        border: none;
        border-radius: 999px;
        background: #1677ff;
        color: #fff;
        font-size: 14px;
      }
      .boot.slow .boot-text {
        display: none;
      }
      .boot.slow .boot-retry {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" id="boot">
        <div class="boot-spinner"></div>
        <div class="boot-text">正在进入工作台账...</div>
        <button class="boot-retry" onclick="location.reload()">加载缓慢，点击重试</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // 启动超时兜底：12 秒仍未完成 Vue 挂载（弱网/资源加载失败），显示重试按钮而非无限白屏
      setTimeout(function () {
        var el = document.getElementById('boot')
        if (el) el.className = 'boot slow'
      }, 12000)
    </script>
  </body>
</html>
